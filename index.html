<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>濁点ジェネレーター</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f0f0; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 500px; }
        textarea { width: 100%; height: 150px; margin-bottom: 10px; padding: 10px; box-sizing: border-box; }
        .controls { display: flex; gap: 10px; margin-bottom: 10px; }
        button { padding: 10px 20px; cursor: pointer; border: none; background: #333; color: white; border-radius: 5px; }
        button:active { background: #555; }
        #output { width: 100%; min-height: 100px; padding: 10px; background: white; border: 1px solid #ccc; box-sizing: border-box; word-break: break-all; overflow-wrap: break-word; }
    </style>
</head>
<body>
    <div class="container">
        <h2>濁点ジェネレーター</h2>
        <textarea id="input" placeholder="ここになんか叫べ..."></textarea>
        <div class="controls">
            <button onclick="copyText()">コピー</button>
            <button onclick="clearText()">全部消す</button>
        </div>
        <div id="output"></div>
    </div>

    <script>
        const input = document.getElementById('input');
        const output = document.getElementById('output');

        input.addEventListener('input', () => {
            const text = input.value;
            output.textContent = text.split('').map(char => char + '\u3099').join('');
        });

        function copyText() {
            navigator.clipboard.writeText(output.textContent).then(() => {
                alert('コピーしたで！');
            });
        }

        function clearText() {
            input.value = '';
            output.textContent = '';
        }
    </script>
</body>
</html>
