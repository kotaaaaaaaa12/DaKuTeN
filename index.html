<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>濁点ジェネレーター</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f0f0; }
        textarea { width: 100%; height: 100px; margin-bottom: 10px; }
        #output { font-size: 24px; padding: 10px; background: white; border: 1px solid #ccc; min-height: 50px; word-break: break-all; }
    </style>
</head>
<body>
    <h2>濁点ジェネレーター</h2>
    <textarea id="input" placeholder="ここになんか書けや..."></textarea>
    <div id="output"></div>

    <script>
        const input = document.getElementById('input');
        const output = document.getElementById('output');

        input.addEventListener('input', () => {
            const text = input.value;
            // 全ての文字の直後に結合濁点(U+3099)を挿入する
            const result = text.split('').map(char => char + '\u3099').join('');
            output.textContent = result;
        });
    </script>
</body>
</html>
